name: 自动生成笔记索引
on:
  push:
    branches: [ main ]
    paths:
      - 'notes/**' # 只有notes文件夹变化时触发

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成note-index.json
        run: |
          # 创建索引生成脚本
          echo "const fs = require('fs');const path = require('path');const NOTES_ROOT = path.join(__dirname, 'notes');const INDEX_OUTPUT = path.join(__dirname, 'note-index.json');function scanNotesDir(currentDir, relativeDir = ''){const result = {type: 'dir',name: path.basename(currentDir),path: relativeDir,children: []};const files = fs.readdirSync(currentDir, { withFileTypes: true });const dirs = [];const notes = [];files.forEach(file => {const filePath = path.join(currentDir, file.name);const fileRelativePath = relativeDir ? `${relativeDir}/${file.name}` : file.name;if (file.isDirectory()) {const subDir = scanNotesDir(filePath, fileRelativePath);dirs.push(subDir);} else if (file.isFile() && file.name.endsWith('.md')) {const noteName = file.name.replace('.md', '');const sortKey = noteName.match(/^(\d+)-/) ? parseInt(noteName.match(/^(\d+)-/)[1]) : 999;notes.push({type: 'note',name: noteName,path: fileRelativePath,sortKey: sortKey});}});dirs.sort((a, b) => a.name.localeCompare(b.name));notes.sort((a, b) => a.sortKey - b.sortKey);result.children = [...dirs, ...notes];return result;}try {const noteIndex = scanNotesDir(NOTES_ROOT);noteIndex.generatedAt = new Date().toISOString();fs.writeFileSync(INDEX_OUTPUT, JSON.stringify(noteIndex, null, 2), 'utf-8');console.log('索引生成成功');} catch (error) {console.error('索引生成失败：', error.message);process.exit(1);}" > generate-index.js
          # 运行脚本生成索引
          node generate-index.js

      - name: 提交索引文件
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add note-index.json
          git commit -m "自动生成笔记索引" || echo "无索引变化"
          git push