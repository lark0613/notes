<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lark 的笔记站</title>
  
  <!-- Docsify 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  
  <!-- 搜索 + 代码复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  
  <!-- 自动侧边栏插件（神器！扫描所有 .md） -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-auto-sidebar@latest"></script>
  
  <!-- 深色模式 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-dark-mode@2"></script>
</head>
<body>
  <div id="app"></div>
  
  <script>
    // 延迟初始化（防旧错误）
    window.addEventListener('load', function() {
      setTimeout(function() {
        try {
          window.$docsify = {
            name: 'Lark 的笔记',
            repo: 'lark0613/notes',
            // 自动侧边栏：扫描 docs/ 所有 .md 文件和文件夹
            autoSidebar: true,
            autoSidebarDepth: 3,      // 支持 3 级子目录
            loadSidebar: true,        // 启用侧边栏
            homepage: 'README.md',    // 首页
            maxLevel: 6,              // Markdown 标题深度
            relativePath: true,       // 支持子文件夹路径
            search: { placeholder: '搜索笔记...', noData: '找不到~' }
          };
          Docsify();
          console.log('Docsify + 自动侧边栏初始化成功！');
        } catch (error) {
          console.error('初始化失败:', error);
          document.getElementById('app').innerHTML = '<h1>加载中... 请刷新</h1>';
        }
      }, 500);
    });
  </script>
</body>
</html>
