<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lark 的笔记站</title>
  
  <!-- Docsify 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- 经典主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  
  <!-- 搜索插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- 代码复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  
  <!-- 深色模式 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-dark-mode@2"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/javascript">
    /* VS Code: 这下面是 JavaScript 配置对象 */
    window.$docsify = {
      name: 'Lark 的笔记',
      repo: 'lark0613/notes',
      maxLevel: 6,
      loadSidebar: true,  // 自动加载侧边栏（会扫描所有 .md 文件）
      relativePath: true, // 支持子文件夹
      homepage: 'README.md',
      search: 'auto',     // 自动搜索
      auto2top: true
    };
  </script>
</body>
</html>
