<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lark 的笔记站</title>
  
  <!-- Docsify 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- 经典好看主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  
  <!-- 搜索 + 代码复制 + 深色模式 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-dark-mode@2"></script>
  
  <style>
    /* 让手机上更好看 */
    body { margin: 0; }
    .sidebar { font-size: 15px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Lark 的笔记',
      repo: 'lark0613/notes',
      maxLevel: 6,
      loadSidebar: '_sidebar.md',   // 使用我们手动写的超级稳定的侧边栏
      subMaxLevel: 3,               // 侧边栏支持三级
      auto2top: true,
      homepage: 'README.md',
      search: { placeholder: '搜索...', noData: '找不到~' }
    }
  </script>
</body>
</html>
