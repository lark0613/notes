<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的笔记仓库</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏：多级目录+搜索+排序 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📝 笔记目录</h2>
                <button id="toggle-sidebar" class="sidebar-toggle">
                    <i class="fa fa-angle-left"></i>
                </button>
            </div>
            
            <!-- 搜索框 -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜索笔记名/内容...">
            </div>
            
            <!-- 排序按钮 -->
            <div class="sort-controls">
                <select id="sort-select">
                    <option value="name">按名称排序</option>
                    <option value="created">按创建时间排序</option>
                </select>
            </div>
            
            <!-- 多级目录容器 -->
            <ul id="note-tree" class="note-tree"></ul>
        </aside>

        <!-- 主内容区 -->
        <main class="content" id="content">
            <div class="content-header">
                <div id="search-result-tip" class="search-result-tip"></div>
                <button id="toggle-theme" class="theme-toggle">
                    <i class="fa fa-moon-o"></i> 暗黑模式
                </button>
            </div>
            
            <div id="note-content">
                <div class="welcome">
                    <h1>欢迎来到我的笔记仓库</h1>
                    <p>选择左侧目录中的笔记查看内容</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
